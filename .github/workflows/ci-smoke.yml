name: CI - Smoke Test

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t order-tracker-web .

      - name: Start container
        run: |
          docker run -d --name order-tracker-ci -p 5000:5000 order-tracker-web

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sS http://localhost:5000/ >/dev/null 2>&1; then
              echo "app is ready"; exit 0
            fi
            sleep 1
          done
          echo "app did not become ready" >&2
          docker logs order-tracker-ci || true
          exit 1

      - name: Create vendor (smoke)
        run: |
          curl -sS -X POST -d "name=CI Vendor&platform=CI&contact_email=ci@example.com" \
            http://localhost:5000/api/vendors -o vendor.json
          cat vendor.json

      - name: Create order and verify
        run: |
          VENDOR_ID=$(python3 -c "import json,sys; print(json.load(open('vendor.json'))['id'])")
          echo "Vendor id: $VENDOR_ID"
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -d "vendor_id=${VENDOR_ID}&status=Pending&tracking_number=CI123&product[]=CIItem&quantity[]=1&cost[]=1.00" \
            http://localhost:5000/add)
          echo "Create order returned HTTP status: $STATUS"
          if [ "$STATUS" != "302" ]; then
            echo "Order creation failed"; docker logs order-tracker-ci || true; exit 1
          fi
          sleep 1
          # verify vendor page contains the item name
          curl -sS http://localhost:5000/vendor/${VENDOR_ID} | grep -q "CIItem"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f order-tracker-ci || true
