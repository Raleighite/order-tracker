{% extends "base.html" %}
{% block content %}
<h2>Edit Order #{{ order.id }}</h2>
<form method="POST">
    <div class="mb-3">
        <label class="form-label">Vendor</label>
        <input class="form-control" type="text" name="vendor" value="{{ order.vendor }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Tracking Number</label>
        <input class="form-control" type="text" name="tracking_number" value="{{ order.tracking_number }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Status</label>
        <select class="form-control" name="status">
            <option value="Pending" {% if order.status == 'Pending' %}selected{% endif %}>Pending</option>
            <option value="Shipped" {% if order.status == 'Shipped' %}selected{% endif %}>Shipped</option>
        </select>
    </div>

    <div class="row">
        <div class="col mb-3">
            <label class="form-label">Sales Tax</label>
            <input class="form-control" type="number" step="0.01" name="sales_tax" value="{{ order.sales_tax or '' }}">
        </div>
        <div class="col mb-3">
            <label class="form-label">Shipping Cost</label>
            <input class="form-control" type="number" step="0.01" name="shipping_cost" value="{{ order.shipping_cost or '' }}">
        </div>
        <div class="col mb-3">
            <label class="form-label">Customs Tariff</label>
            <input class="form-control" type="number" step="0.01" name="customs_tariff" value="{{ order.customs_tariff or '' }}">
        </div>
    </div>

    <div class="row mb-3">
        <div class="col">
            <label class="form-label">Shipper</label>
            <input class="form-control" name="shipper" value="{{ order.shipper or '' }}">
        </div>
        <div class="col">
            <label class="form-label">Vendor Platform</label>
            <input class="form-control" name="vendor_platform" value="{{ order.vendor_platform or '' }}">
        </div>
    </div>

    <h5>Items</h5>
    <div id="items">
        {% for item in order.items %}
        <div class="row mb-2 item-row">
            <div class="col">
                <input class="form-control" name="product[]" value="{{ item.product }}">
            </div>
            <div class="col">
                <input class="form-control" name="quantity[]" value="{{ item.quantity }}" type="number" min="1">
            </div>
            <div class="col">
                <input class="form-control" name="cost[]" value="{{ item.cost or '' }}" placeholder="Per-item cost" type="number" step="0.01">
            </div>
        </div>
        {% endfor %}
    </div>
    <button class="btn btn-secondary mb-3" type="button" onclick="addItem()">+ Add Item</button>

    <button class="btn btn-primary">Save Changes</button>
</form>

<script>
function addItem() {
    const row = document.createElement('div');
    row.className = "row mb-2 item-row";
    row.innerHTML = `
        <div class="col">
            <input class="form-control" name="product[]" placeholder="Product name">
        </div>
        <div class="col">
            <input class="form-control" name="quantity[]" placeholder="Quantity" type="number" min="1" value="1">
        </div>`;
    document.getElementById('items').appendChild(row);
}
</script>
{% endblock %}
